<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈꽃마을 시간여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#c4935f; --wood-d:#8a5f3b; --cream:#fffaf0; --cream2:#fff1d6; --green:#5bb873; --green-d:#3f8f55;
  --red:#e3605b; --red-d:#b8433f; --ink:#5a4632; --blue:#6aa9e0; --gold:#f5c542; --mint:#7fd3c4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);background:#3d4a8a;user-select:none;-webkit-user-select:none}
button{font-family:'Jua','Malgun Gothic',sans-serif;cursor:pointer;border:none;color:inherit}
.jua{font-family:'Jua','Malgun Gothic',sans-serif}
.hidden{display:none!important}

/* ---------- WORLD ---------- */
#world{position:fixed;inset:0;overflow:hidden}
#sky{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(#050819 0%,#0d1438 30%,#1d2560 58%,#43407e 82%,#7a6496 100%);overflow:hidden}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2.4s infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
#moon{position:absolute;right:7%;top:9%;width:clamp(40px,6vw,82px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8);box-shadow:0 0 40px 12px rgba(255,240,190,.45)}
/* 오로라: 캔버스에 커튼 모양 빛줄기를 그려서 일렁이게 함 */
#aurora{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity 2.5s;pointer-events:none;filter:blur(2px);mix-blend-mode:screen}
#aurora.on{opacity:1}
#mountains{position:absolute;left:0;bottom:-2px;width:100%;height:45%}
#ground{position:absolute;left:-10%;width:120%;top:42%;bottom:0;background:radial-gradient(ellipse at 50% 0%,#ffffff 0%,#f1f6fe 45%,#dce7f7 100%);border-radius:50% 50% 0 0/70px 70px 0 0;box-shadow:inset 0 10px 30px rgba(255,255,255,.9)}
#paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scenery{position:absolute;transform:translate(-50%,-100%);font-size:clamp(26px,4vw,54px);pointer-events:none;filter:drop-shadow(0 4px 2px rgba(60,80,130,.25))}
.river-label{position:absolute;font-family:'Jua';color:#3f7fb8;font-size:clamp(12px,1.5vw,18px);transform:translate(-50%,-50%);opacity:.8;pointer-events:none}

.bld{position:absolute;transform:translate(-50%,-100%);text-align:center;cursor:pointer;transition:transform .2s}
.bld:hover{transform:translate(-50%,-100%) scale(1.06)}
.bld .icon{font-size:clamp(50px,8.5vw,118px);line-height:1;filter:drop-shadow(0 8px 4px rgba(60,80,130,.3));position:relative}
#labelLayer{position:absolute;inset:0;z-index:450;pointer-events:none}
/* 장소 이름: 땅에 꽂힌 나무 팻말 (캠핑장 팻말과 같은 모양) */
.tag{position:absolute;transform:translate(-50%,0) rotate(var(--tilt,-2deg));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 4px 3px rgba(40,50,90,.28))}
.tag .sign{position:relative;display:inline-block;background:linear-gradient(#d8a46d,#a8703f);color:#fff;border:3px solid #7d5130;border-radius:8px;padding:5px 14px 5px;font-family:'Jua';font-size:clamp(15px,1.85vw,24px);line-height:1.2;white-space:nowrap;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.tag .sign::before{content:'';position:absolute;left:8px;right:12px;top:-8px;height:10px;background:#fff;border-radius:99px;box-shadow:0 1px 0 rgba(150,170,210,.5)}
.tag .sign::after{content:'';position:absolute;inset:3px;border-radius:5px;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(0,0,0,.05) 9px 10px);pointer-events:none}
.tag .sign small{display:block;font-size:.6em;opacity:.95;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tag .sign .st{display:block;font-size:.62em;letter-spacing:1px;margin-top:1px;text-shadow:none}
.tag .post{width:9px;height:clamp(12px,1.7vw,22px);margin-top:-2px;background:linear-gradient(90deg,#6e4426,#a8703f,#6e4426)}
.tag .mound{width:38px;height:11px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 2px 2px rgba(60,80,130,.22)}
.tag.locked .sign{background:linear-gradient(#a6abb6,#7f899e);border-color:#5b6378}
.tag.locked .post{background:linear-gradient(90deg,#5b6378,#8a93a6,#5b6378)}
.tag:hover .sign{filter:brightness(1.08)}
/* 잠긴 장소도 알록달록하게 (살짝만 어둡게 + 자물쇠) */
.bld.locked .icon{filter:saturate(.9) brightness(.94) drop-shadow(0 8px 4px rgba(60,80,130,.3))}
/* 시장 골목: 노란색 마트 */
.bld .icon .mart{display:inline-block;filter:sepia(1) saturate(4.5) hue-rotate(2deg) brightness(1.12) contrast(1.05)}
/* 착한 회사: 친환경 민트·초록빛 빌딩 */
.bld .icon .office{display:inline-block;filter:sepia(.85) saturate(3.2) hue-rotate(115deg) brightness(1.1)}
/* 미래 트리 광장: 더 화사한 색 */
.bld .icon .future{display:inline-block;filter:saturate(1.5) brightness(1.08)}
.lockbadge{position:absolute;right:-6%;top:0;font-size:.38em}
.bld.current .icon{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.here{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--red);color:#fff;font-family:'Jua';padding:3px 10px;border-radius:999px;font-size:clamp(11px,1.3vw,16px);white-space:nowrap;animation:bob 1s infinite}
.here::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--red);border-bottom:0}

/* avatar */
#avatar{position:absolute;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;font-size:clamp(46px,6.2vw,80px);cursor:pointer;text-align:center;line-height:1}
#avatar .av{position:relative;width:1.2em;height:1.46em;margin:0 auto;transform:scaleX(var(--dir,1))}
#avatar .av.solo{height:1.15em}
#avatar .body{position:absolute;left:50%;top:0;width:max-content;white-space:nowrap;line-height:1.15em;text-align:center;z-index:2;filter:drop-shadow(0 3px 2px rgba(60,80,130,.3))}
/* 몸통: 동물마다 털색·배·발·꼬리를 다르게 (머리가 몸 위에 살짝 겹쳐 앉도록) */
#avatar .torso{position:absolute;left:50%;top:.92em;width:.58em;height:.46em;transform:translateX(-50%);border-radius:48% 48% 42% 42%;z-index:1;
  background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.28),transparent 60%),var(--fur);box-shadow:inset 0 -.05em 0 rgba(0,0,0,.12),0 .03em .05em rgba(60,80,130,.25)}
#avatar .belly{position:absolute;left:50%;top:.1em;width:.34em;height:.28em;transform:translateX(-50%);border-radius:50%;background:var(--belly)}
#avatar .arm{position:absolute;top:.06em;width:.16em;height:.23em;border-radius:50%;background:var(--limb);transform-origin:50% 15%;box-shadow:inset 0 -.03em 0 rgba(0,0,0,.12)}
#avatar .arm.l{left:-.07em;transform:rotate(25deg)} #avatar .arm.r{right:-.07em;transform:rotate(-25deg)}
#avatar .feet{position:absolute;left:50%;top:1.31em;width:.42em;height:.14em;transform:translateX(-50%);z-index:1}
#avatar .foot{position:absolute;top:0;width:.19em;height:.13em;border-radius:50% 50% 45% 45%;background:var(--paw);box-shadow:0 .03em .04em rgba(0,0,0,.25)}
#avatar .foot.l{left:0} #avatar .foot.r{right:0}
#avatar .tail{position:absolute;z-index:0}
#avatar .tail.puff{left:calc(50% + .18em);top:1.14em;width:.2em;height:.2em;border-radius:50%;background:var(--tail)}
#avatar .tail.long{left:calc(50% + .22em);top:.9em;width:.08em;height:.4em;border-radius:.05em;background:var(--tail);transform:rotate(30deg);transform-origin:bottom center}
#avatar .tail.bushy{left:calc(50% + .18em);top:.9em;width:.21em;height:.44em;border-radius:50% 50% 45% 45%;background:linear-gradient(var(--tip,#fff) 0 24%,var(--tail) 24%);transform:rotate(40deg);transform-origin:bottom center}
#avatar .tail.curl{left:calc(50% + .22em);top:1.02em;width:.19em;height:.19em;border-radius:50%;border:.06em solid var(--tail);border-left-color:transparent;transform:rotate(20deg)}
#avatar.walking .av{animation:walk .32s ease-in-out infinite alternate}
#avatar.walking .foot.l{animation:stepL .32s ease-in-out infinite alternate}
#avatar.walking .foot.r{animation:stepL .32s ease-in-out infinite alternate-reverse}
#avatar.walking .arm.l{animation:swingL .32s ease-in-out infinite alternate}
#avatar.walking .arm.r{animation:swingR .32s ease-in-out infinite alternate}
@keyframes walk{from{transform:scaleX(var(--dir,1)) translateY(0) rotate(-3deg)}to{transform:scaleX(var(--dir,1)) translateY(-4px) rotate(3deg)}}
@keyframes stepL{from{transform:translateY(0)}to{transform:translateY(-.08em)}}
@keyframes swingL{from{transform:rotate(30deg)}to{transform:rotate(-5deg)}}
@keyframes swingR{from{transform:rotate(5deg)}to{transform:rotate(-30deg)}}
#avatar .hint{display:none;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--green);color:#fff;font-family:'Jua';font-size:clamp(12px,1.3vw,16px);padding:4px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 var(--green-d);animation:bob 1s infinite}
#avatar.near .hint{display:block}
#avatar .nametag{font-family:'Jua';font-size:clamp(11px,1.2vw,15px);line-height:1.5;background:rgba(255,255,255,.9);border-radius:999px;padding:1px 9px;display:table;margin:-2px auto 0;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.08)}
/* 산타 모자: 머리 폭만큼 크게, 정수리를 덮도록 (top은 동물마다 JS로 맞춤) */
.santa-hat{position:absolute;left:.26em;top:-.2em;width:.68em;height:.48em;transform:rotate(8deg);transform-origin:50% 100%;pointer-events:none;z-index:4}
.santa-hat .cone{position:absolute;left:4%;right:4%;top:0;bottom:16%;background:linear-gradient(135deg,#ff7b6b,#d83a3a);clip-path:polygon(0 100%,8% 55%,30% 22%,60% 2%,72% 8%,86% 45%,100% 100%);border-radius:0 0 4px 4px}
.santa-hat .band{position:absolute;left:0;right:0;bottom:0;height:24%;background:#fff;border-radius:999px;box-shadow:0 2px 2px rgba(0,0,0,.15)}
.santa-hat .pom{position:absolute;left:52%;top:-12%;width:.15em;height:.15em;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.crown{position:absolute;left:50%;top:-.3em;transform:translateX(-50%);font-size:.6em;z-index:4;line-height:1}
.orbit{position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;animation:spin 3.5s linear infinite;pointer-events:none}
.orbit span{position:absolute;font-size:.22em;color:#fff;text-shadow:0 0 6px #9fd8ff}
.orbit span:nth-child(1){left:50%;top:0}.orbit span:nth-child(2){left:0;top:60%}.orbit span:nth-child(3){right:0;top:60%}
@keyframes spin{to{transform:rotate(360deg)}}
/* 목에 두른 줄무늬 목도리 (한쪽 끝이 늘어짐) */
.scarf2{position:absolute;left:50%;top:.97em;width:.52em;height:.13em;margin-left:-.26em;border-radius:.07em;z-index:3;
  background:repeating-linear-gradient(90deg,#e3473f 0 .08em,#ffffff .08em .115em);box-shadow:0 .02em .03em rgba(0,0,0,.25),inset 0 -.02em 0 rgba(0,0,0,.15)}
.scarf2::after{content:'';position:absolute;right:.05em;top:.08em;width:.12em;height:.25em;border-radius:.03em .03em .02em .02em;transform:rotate(-10deg);transform-origin:top center;
  background:repeating-linear-gradient(180deg,#e3473f 0 .07em,#ffffff .07em .1em);box-shadow:0 .02em .03em rgba(0,0,0,.25)}
.av.solo .scarf2{top:.49em;width:.46em;height:.09em;margin-left:-.23em}
.av.solo .scarf2::after{width:.09em;height:.18em;top:.06em}
.av.solo .nose{top:.43em;width:.1em;height:.1em}
.nose{position:absolute;left:50%;top:.7em;width:.13em;height:.13em;background:#ff2b2b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 8px 4px rgba(255,60,60,.75);animation:nosePulse .9s infinite alternate;z-index:3}
@keyframes nosePulse{from{box-shadow:0 0 4px 2px rgba(255,60,60,.5)}to{box-shadow:0 0 14px 7px rgba(255,60,60,.9)}}

/* decor */
.decor{position:absolute;transform:translate(-50%,-100%);font-size:clamp(34px,5vw,66px);cursor:grab;touch-action:none;line-height:1;filter:drop-shadow(0 5px 3px rgba(60,80,130,.3))}
.decor:active{cursor:grabbing}
.decor .in{position:relative;display:inline-block}
.decor.snowman .in{animation:wobble 2.5s ease-in-out infinite;transform-origin:bottom center}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.decor.fire .flame{display:inline-block;animation:flicker .25s infinite alternate;transform-origin:bottom center;position:relative;z-index:1;margin-bottom:.1em}
/* 모닥불 장작: 통나무 두 개를 X자로 겹침 + 돌 테두리 */
.decor.fire .logs{position:absolute;left:50%;bottom:0;width:1em;height:.26em;transform:translateX(-50%);z-index:2}
.decor.fire .logs i{position:absolute;left:.04em;right:.04em;top:.06em;height:.14em;border-radius:.07em;background:linear-gradient(#a8703f,#6b4122);box-shadow:inset -.06em 0 0 #e0b07c,inset .06em 0 0 #e0b07c}
.decor.fire .logs i:nth-child(1){transform:rotate(16deg)} .decor.fire .logs i:nth-child(2){transform:rotate(-16deg)}
.decor.fire .logs b{position:absolute;bottom:-.02em;width:.16em;height:.1em;border-radius:50%;background:linear-gradient(#b9c0cc,#7d8594)}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(1.06,.94)}}
.decor.fire::before,.decor.lamp::before{content:'';position:absolute;left:50%;top:40%;width:2.6em;height:2.6em;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,180,90,0) 70%);animation:glow 1.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.6;transform:translate(-50%,-50%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.decor.tree{font-size:clamp(50px,7.2vw,96px)}
.decor.ontable{font-size:clamp(22px,2.8vw,38px)}
/* 옆에서 본 머그잔 (핫초코) */
.mug{position:relative;display:inline-block;width:1.05em;height:.95em;vertical-align:bottom}
.mug .saucer{position:absolute;left:.02em;right:.1em;bottom:0;height:.15em;border-radius:50%;background:linear-gradient(#ffffff,#d9e1ec);box-shadow:0 .03em .04em rgba(0,0,0,.22)}
.mug .cup{position:absolute;left:.14em;bottom:.08em;width:.6em;height:.62em;border-radius:.03em .03em .22em .22em/.03em .03em .16em .16em;
  background:linear-gradient(90deg,#a82a28 0%,#e8504a 22%,#ff8a80 38%,#e3473f 62%,#a02624 100%);box-shadow:inset 0 -.04em 0 rgba(0,0,0,.15)}
.mug .cup::before{content:'';position:absolute;left:0;right:0;top:-.075em;height:.15em;border-radius:50%;background:linear-gradient(90deg,#d94a44,#ffb3ab 45%,#d94a44)}
.mug .cup::after{content:'';position:absolute;left:.05em;right:.05em;top:-.05em;height:.1em;border-radius:50%;background:radial-gradient(ellipse at 40% 40%,#9a6040,#5e341d)}
.mug .handle{position:absolute;left:.68em;bottom:.22em;width:.22em;height:.3em;border:.075em solid #b8312f;border-left:none;border-radius:0 .17em .17em 0}
.mug .flake{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:.36em;color:#fff;line-height:1;opacity:.95}
.mug .mallow{position:absolute;top:-.07em;width:.11em;height:.07em;border-radius:.02em;background:#fff;box-shadow:0 .01em .01em rgba(0,0,0,.2);z-index:1}
/* 캠핑장 */
.camp{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.camp.tent{font-size:clamp(70px,9.5vw,124px);line-height:1;filter:drop-shadow(0 6px 3px rgba(60,80,130,.3))}
.camp.tent::before{content:'';position:absolute;left:50%;top:62%;width:1.1em;height:.7em;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,214,130,.55),rgba(255,200,110,0) 70%);animation:glow 2s ease-in-out infinite alternate;z-index:-1}
.camp.tent .tentEmoji{display:inline-block;filter:hue-rotate(-62deg) saturate(1.5) brightness(1.12)} /* 초록 텐트 → 노란 텐트 */
.camp.tent .bulbs{position:absolute;left:10%;right:10%;bottom:8%;height:.06em}
.camp.tent .bulbs i{position:absolute;bottom:0;width:.05em;height:.05em;border-radius:50%;animation:blink 1s infinite alternate}
#campTable{width:clamp(84px,10.5vw,140px);height:clamp(36px,4.6vw,64px);filter:drop-shadow(0 4px 2px rgba(60,80,130,.25))}
#campTable .top{position:absolute;left:0;right:0;top:0;height:24%;background:linear-gradient(#d39a62,#a86f3f);border-radius:7px;box-shadow:0 3px 0 #7d5130}
#campTable .top::before{content:'';position:absolute;left:6%;right:10%;top:-3px;height:5px;background:#fff;border-radius:99px;opacity:.9}
#campTable .leg{position:absolute;top:20%;bottom:0;width:9%;background:#8a5f3b;border-radius:2px}
#campTable .leg.l{left:13%} #campTable .leg.r{right:13%}
/* 땅에 꽂힌 나무 팻말 */
.camp.sign{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%) rotate(-4deg);transform-origin:50% 100%;filter:drop-shadow(0 3px 2px rgba(60,80,130,.25))}
.camp.sign .board{position:relative;font-family:'Jua';font-size:clamp(9px,.95vw,13px);line-height:1.2;text-align:center;background:linear-gradient(#cf9b66,#a8703f);color:#fff;padding:3px 7px 3px;border-radius:5px;border:2px solid #7d5130;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.camp.sign .board::before{content:'';position:absolute;left:5px;right:8px;top:-6px;height:7px;background:#fff;border-radius:99px}
.camp.sign .post{width:6px;height:clamp(12px,1.8vw,22px);background:linear-gradient(90deg,#6e4426,#a8703f,#6e4426);margin-top:-1px}
.camp.sign .mound{width:30px;height:9px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 2px 2px rgba(60,80,130,.2)}
.decor.tree .light{position:absolute;width:.11em;height:.11em;border-radius:50%;animation:blink 1s infinite alternate}
@keyframes blink{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.2)}}
.decor.tree .topstar{position:absolute;left:50%;top:-.28em;transform:translateX(-50%);font-size:.4em;animation:blink 1.2s infinite alternate;text-shadow:0 0 10px #ffe17a}
.decor.gift .in{animation:hop 2s ease-in-out infinite}
@keyframes hop{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-10px)}}
#cat{position:absolute;transform:translate(-50%,-100%);font-size:clamp(30px,3.8vw,48px);cursor:pointer;line-height:1}
#cat .in{display:inline-block;transform-origin:50% 100%;filter:drop-shadow(0 3px 2px rgba(60,80,130,.3))}
#cat .shadow{position:absolute;left:50%;bottom:-.04em;width:.7em;height:.12em;margin-left:-.35em;border-radius:50%;background:rgba(60,80,130,.18);z-index:-1}
#cat .zz{position:absolute;left:62%;top:-25%;font-size:.42em;display:none;animation:zz 1.8s infinite}
#cat.sleep .zz{display:block}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-24px) scale(1.15)}}
#cat .bub{position:absolute;left:50%;bottom:110%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:2px 10px;font-family:'Jua';font-size:.34em;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12);display:none}
#cat.talk .bub{display:block}
/* 한강 위에서 스케이트·썰매 타는 아이들 */
.rinker{position:absolute;transform:translate(-50%,-100%);font-size:clamp(34px,4.2vw,56px);pointer-events:none;line-height:1}
.rinker .kb{display:inline-block;position:relative;transform-origin:50% 100%}
/* 직접 그린 아이 (털모자·패딩·목도리·장갑·다리·스케이트) */
.kidf{display:block;position:relative;width:.9em;height:1.45em;margin:0 auto}
.kidf>span{display:block}
.kidf .hd{position:absolute;left:50%;top:.2em;width:.5em;height:.47em;margin-left:-.25em;border-radius:50%;z-index:3;
  background:radial-gradient(circle at 24% 68%,rgba(255,140,140,.75) 0 .045em,transparent .06em),radial-gradient(circle at 76% 68%,rgba(255,140,140,.75) 0 .045em,transparent .06em),var(--skin)}
.kidf .hd::before{content:'';position:absolute;top:.22em;left:.13em;width:.055em;height:.07em;border-radius:50%;background:#3a2a20;box-shadow:.19em 0 0 #3a2a20}
.kidf .hd::after{content:'';position:absolute;top:.31em;left:50%;width:.1em;height:.045em;margin-left:-.05em;border-bottom:.025em solid #8a4a3a;border-radius:0 0 .06em .06em}
.kidf .hat{position:absolute;left:50%;top:.1em;width:.54em;height:.27em;margin-left:-.27em;border-radius:.27em .27em .04em .04em;background:var(--hat);z-index:4;box-shadow:inset 0 -.06em 0 rgba(255,255,255,.85)}
.kidf .hat::before{content:'';position:absolute;left:50%;top:-.09em;width:.14em;height:.14em;margin-left:-.07em;border-radius:50%;background:#fff}
.kidf .coat{position:absolute;left:50%;top:.62em;width:.56em;height:.48em;margin-left:-.28em;border-radius:.2em .2em .12em .12em;z-index:2;
  background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 30%,transparent 70%,rgba(0,0,0,.1)),var(--coat);box-shadow:inset 0 -.04em 0 rgba(0,0,0,.12)}
.kidf .coat::after{content:'';position:absolute;left:50%;top:.08em;bottom:.04em;width:.02em;margin-left:-.01em;background:rgba(0,0,0,.18)}
.kidf .scf{position:absolute;left:50%;top:.6em;width:.44em;height:.09em;margin-left:-.22em;border-radius:.05em;background:var(--scarf);z-index:3}
.kidf .scf::after{content:'';position:absolute;right:.04em;top:.06em;width:.08em;height:.18em;border-radius:.03em;background:var(--scarf)}
.kidf .arm{position:absolute;top:.66em;width:.13em;height:.34em;border-radius:.07em;background:var(--coat);z-index:1;transform-origin:50% 8%}
.kidf .arm::after{content:'';position:absolute;left:-.01em;bottom:-.05em;width:.15em;height:.12em;border-radius:50%;background:var(--hat)}
.kidf .arm.l{left:.05em;transform:rotate(40deg)} .kidf .arm.r{right:.05em;transform:rotate(-40deg)}
.kidf .leg{position:absolute;top:1.04em;width:.13em;height:.3em;border-radius:.05em;background:#3b4a7a;z-index:1;transform-origin:50% 0}
.kidf .leg.l{left:.29em} .kidf .leg.r{right:.29em}
.kidf .boot{position:absolute;left:-.05em;bottom:-.05em;width:.22em;height:.11em;border-radius:.05em .09em .02em .02em;background:#fff;box-shadow:0 .02em 0 rgba(0,0,0,.15)}
.kidf .boot::after{content:'';position:absolute;left:-.02em;right:-.03em;bottom:-.045em;height:.025em;background:#b9c4d6;border-radius:.02em}
.rinker.skate .leg.l{animation:pushL .7s ease-in-out infinite alternate}
.rinker.skate .leg.r{animation:pushL .7s ease-in-out infinite alternate-reverse}
.rinker.skate .arm.l{animation:armS .7s ease-in-out infinite alternate}
.rinker.skate .arm.r{animation:armS2 .7s ease-in-out infinite alternate}
@keyframes pushL{from{transform:rotate(18deg)}to{transform:rotate(-6deg)}}
@keyframes armS{from{transform:rotate(60deg)}to{transform:rotate(25deg)}}
@keyframes armS2{from{transform:rotate(-25deg)}to{transform:rotate(-60deg)}}
/* 썰매: 아이가 썰매 위에 앉은 모습 */
.rinker.sled .kidf{height:1.08em;font-size:.95em}
.rinker.sled .kidf .leg{display:none}
.rinker.sled .kidf .arm.l{transform:rotate(-20deg)} .rinker.sled .kidf .arm.r{transform:rotate(20deg)}
.rinker.sled .sl{display:block;font-size:1.15em;margin-top:-.42em;position:relative;z-index:5;line-height:1}
.rinker .shadow{position:absolute;left:50%;bottom:-.06em;width:.9em;height:.14em;margin-left:-.45em;border-radius:50%;background:rgba(40,80,130,.22)}
@keyframes fly{0%{left:110%;top:12%}50%{top:4%}100%{left:-30%;top:14%}}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:900}

/* ---------- HUD ---------- */

const mtof = m => 440*Math.pow(2,(m-69)/12);
function tone(dest, f, t, dur, type, vol, atk){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(atk||0.006)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
}
function musicBox(dest,m,t,dur,vol){ const f=mtof(m); tone(dest,f,t,Math.max(.5,dur*1.5),'sine',vol); tone(dest,f*2,t,.35,'sine',vol*.22); tone(dest,f*4,t,.12,'sine',vol*.06); }
function jingle(dest,t,vol){
  const s=actx.createBufferSource(); s.buffer=noiseBuf;
  const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.11);

}

const _shiftCache={};
function headShift(ch){
  if(ch in _shiftCache) return _shiftCache[ch];
  let s=0;
  try{
    const c=document.createElement('canvas').getContext('2d');
    c.font='100px '+getComputedStyle(document.body).fontFamily;
    const m=c.measureText(ch);
    if(m.actualBoundingBoxRight!=null) s=(m.width/2-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2)/100;
    if(!isFinite(s)) s=0; s=Math.max(-.2,Math.min(.2,s));
  }catch(e){ s=0; }
  return (_shiftCache[ch]=+s.toFixed(3));
}
// 정수리 높이: 얼굴 그림 가운데 부분(귀 사이)의 가장 윗부분을 직접 재서 모자·왕관 위치를 맞춤
const _skullCache={};
function headTop(ch){
  if(ch in _skullCache) return _skullCache[ch];
  let v=.32;
  try{
    const c=document.createElement('canvas'); c.width=c.height=300; const x=c.getContext('2d');
    x.font='100px '+getComputedStyle(document.body).fontFamily;
    const m=x.measureText(ch); x.fillText(ch,150-m.width/2,150);
    const d=x.getImageData(0,0,300,300).data, tops=[];
    for(let i=142;i<=158;i+=2){ for(let j=0;j<300;j++) if(d[(j*300+i)*4+3]>80){ tops.push(j); break; } }
    if(tops.length && m.fontBoundingBoxAscent){
      tops.sort((a,b)=>a-b); const yt=tops[Math.floor(tops.length/2)];
      const asc=m.fontBoundingBoxAscent, half=(115-(asc+m.fontBoundingBoxDescent))/2;
      v=(half+asc+(yt-150))/100;
    }
    if(!isFinite(v)) v=.32; v=Math.max(.1,Math.min(.55,v));
  }catch(e){ v=.32; }
  return (_skullCache[ch]=v);
}

function tableSpot(side){

  return [ (tr.left+tr.width/2+side*tr.width*.5-wr.left)/wr.width*100, (tr.top+tr.height*.35-wr.top)/wr.height*100 ];

function makeDraggable(el,key,id){
  id=id||key;
  let sx,sy,moved=false,dragging=false;
  el.addEventListener('pointerdown',e=>{ e.stopPropagation(); dragging=true; moved=false; sx=e.clientX; sy=e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>6) moved=true;
    if(moved){ const r=$('world').getBoundingClientRect(); let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100+3; x=Math.max(3,Math.min(97,x)); y=Math.max(46,Math.min(92,y)); el.classList.remove('ontable'); place(el,x,y); S.pos[key]=[x,y]; }
  });
  el.addEventListener('pointerup',e=>{
    dragging=false;
    if(!moved){ decorClick(id,el); return; }
    // 모닥불은 텐트 주변 어디든 자유롭게 (앞에 두면 텐트 앞에, 뒤에 두면 텐트 뒤에 보임)
    if(id==='fire'){ const [x,y]=elCenter(el,.5); burst(x,y,{n:14,speed:120,g:-60,life:.9,colors:['#ffb347','#ffe066'],size:3}); }
    // 테이블 근처에 놓으면 테이블 위에 딱 올려 줌
    const t=document.querySelector('#campTable');
    if(t && el.offsetWidth<90 && id!=='fire'){
      const tr=t.getBoundingClientRect();
      if(e.clientX>tr.left-25 && e.clientX<tr.right+25 && e.clientY>tr.top-60 && e.clientY<tr.bottom+15){
        const side=Math.max(-.7,Math.min(.7,(e.clientX-(tr.left+tr.width/2))/(tr.width*.5)));
        S.pos[key]={table:+side.toFixed(2)}; setDecorPos(el,S.pos[key]); sfx('pop');
      }
    }
    save();
  });
  el.addEventListener('click',e=>e.stopPropagation());
}

function rinkTick(dt){
  if(!$('start').classList.contains('hidden')) return;

    if(r.x<-8||r.x>108){ r.el.remove(); RINK.list.splice(i,1); continue; }
    // 그림 방향: 스케이트는 오른쪽, 썰매는 왼쪽을 보고 있어서 가는 방향에 맞춰 뒤집음

    let tf;
    if(r.type==='skate'){
      if(r.spin<=0 && Math.random()<dt*.12) r.spin=1.1;           // 가끔 빙글 돌기
      let sx=flip; if(r.spin>0){ r.spin-=dt; sx=flip*Math.cos((1.1-r.spin)/1.1*Math.PI*4); }
      const lean=Math.sin(r.ph*3.2)*9, push=Math.abs(Math.sin(r.ph*3.2))*-3;
      tf=`scaleX(${sx.toFixed(3)}) translateY(${push.toFixed(1)}px) rotate(${(lean*.6+r.dir*6).toFixed(1)}deg)`;
    } else {
      const bump=Math.abs(Math.sin(r.ph*9))*-2;
      tf=`scaleX(${flip}) translateY(${bump.toFixed(1)}px) rotate(${(Math.sin(r.ph*5)*2).toFixed(1)}deg)`;
    }
    const kb=r.el.querySelector('.kb'); kb.style.transform=tf;
    place(r.el,r.x,r.y);
    r.trail+=dt;
    if(r.trail>(r.type==='sled'?.05:.09)){ r.trail=0; const b=r.el.getBoundingClientRect(); const px=b.left+b.width/2-r.dir*b.width*.3, py=b.bottom-2;

}

function catTick(dt){

  el.classList.toggle('sleep',CAT.state==='sleep');

let typeFull='';

    if(q.t==='sort'){ c.items2=shuffle(q.items.map(([t,b])=>({t,b,sel:null}))); }

function syrupPrep(q){
  if(q.t==='mc' && !q.off){ const wrong=q.opts.map((o,k)=>o.ok?-1:k).filter(k=>k>=0); q.off=shuffle(wrong).slice(0,Math.max(0,Math.min(2,wrong.length-1))); }
  if(q.t==='order' && !q.picked.length){ q.picked.push(q.items[0]); q.hinted=true; }
  if(q.t==='sort' && !q.hinted){ q.hinted=true; shuffle(q.items2.map((_,k)=>k)).slice(0,2).forEach(k=>{ q.items2[k].sel=q.items2[k].b; q.items2[k].hint=true; }); }
  if(q.t==='ox' && !q.retried) setTimeout(()=>{ if(QZ&&QZ.list&&QZ.list[QZ.qi]===q&&$('fb')&&!$('fb').innerHTML) $('fb').innerHTML='<div class="syrupon" style="margin-top:10px">🧪 틀려도 한 번 더 고를 수 있어요!</div>'; },0);
}
function renderQuestion(){
  const st=STAGES[QZ.si]; const q=QZ.list[QZ.qi];
  let body='';
  if(q.t==='mc') body='<div class="opts">'+q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="n">${k+1}</span>${o.t}</button>`).join('')+'</div>';
  if(q.t==='ox') body='<div class="ox"><button class="opt" data-v="1" style="color:#3f8fd8">⭕</button><button class="opt" data-v="0" style="color:#e3605b">❌</button></div>';

function renderOrder(q){
  const pool=$('pool'), pk=$('picked');
  pool.innerHTML=q.pool.filter(t=>!q.picked.includes(t)).map(t=>`<button class="chip">${t}</button>`).join('') || '<span style="color:#b9a686;padding:8px">모두 골랐어요! 확인해 볼까요?</span>';
  pk.innerHTML=q.picked.map((t,k)=>`<span class="chip"><span class="k">${k+1}</span>${t}</span>`).join('') || '<span style="color:#b9a686;padding:8px">먼저 일어난 것부터 눌러요</span>';
  pool.querySelectorAll('button').forEach(b=>b.onclick=()=>{ sfx('click'); q.picked.push(b.textContent); renderOrder(q); });
  $('undo').onclick=()=>{ q.picked.pop(); renderOrder(q); };
  $('check').disabled = q.picked.length!==q.items.length;
  $('check').onclick=()=>{
    const ok=q.picked.join('|')===q.items.join('|');
    $('undo').disabled=true; $('check').disabled=true;
    pk.innerHTML=q.picked.map((t,k)=>`<span class="chip" style="background:${t===q.items[k]?'#d9f5df':'#ffe0dd'}"><span class="k">${k+1}</span>${t} ${t===q.items[k]?'✔':'✘'}</span>`).join('');
    grade(ok, ok?'':'정답 순서: <b>'+q.items.join(' → ')+'</b>', $('check'));
  };
}
const BINCOL=['#6aa9e0','#f08a5d','#5bb873'];
function renderSort(q){
  const box=$('sortbox');
  box.innerHTML=q.items2.map((it,k)=>`<div class="sortrow"><span class="mark" id="mk${k}"></span><span class="txt">${it.t}</span>${q.bins.map((b,bi)=>`<button class="binbtn ${it.sel===bi?'on':''}" data-k="${k}" data-b="${bi}" style="${it.sel===bi?`background:${BINCOL[bi]};`:''}border-color:${BINCOL[bi]}">${b}</button>`).join('')}</div>`).join('');
  box.querySelectorAll('.binbtn').forEach(b=>b.onclick=()=>{ if(q.done) return; sfx('click'); q.items2[+b.dataset.k].sel=+b.dataset.b; renderSort(q); });
  $('check').disabled = q.items2.some(it=>it.sel===null) || q.done;
  $('check').onclick=()=>{
    q.done=true; let ok=true;
    q.items2.forEach((it,k)=>{ const good=it.sel===it.b; if(!good) ok=false; });
    renderSort(q);
    q.items2.forEach((it,k)=>{ $('mk'+k).textContent = it.sel===it.b?'✅':'❌'; });
    grade(ok, ok?'':'❌ 표시된 카드의 정답: '+q.items2.filter(it=>it.sel!==it.b).map(it=>`<b>${it.t} → ${q.bins[it.b]}</b>`).join(', '), $('check'));

}
function grade(ok, extra, el){
  const q=QZ.list[QZ.qi]; QZ.results[QZ.qi]=ok;
  const [x,y]=elCenter(el);
  if(ok){
    QZ.correct++; QZ.earned+=10; addCoins(10);
    if(has('bell')){ sfx('bell'); burst(x,y,{n:12,chars:['🔔','✨'],size:22,speed:220,g:200,life:1.2}); } else sfx('correct');
    burst(x,y,{n:26,speed:260,life:1,g:220,size:4}); textPop(x,y-20,'+10 🌰','#fff6a8');
  } else { sfx('wrong'); }
  const last = QZ.qi===QZ.list.length-1;
  // 확인 버튼 줄은 치우고, 해설과 '다음' 버튼을 한 줄에 (화면 한 장에 들어가도록)
  document.querySelectorAll('#modalPanel .panel-body > .rowbtns').forEach(e=>e.remove());
  $('fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="fbrow"><div><div class="big">${ok?'🎉 정답이에요! +10🌰':'😢 아쉬워요!'}</div>${extra?extra+'<br>':''}💡 ${q.e}</div>
    <button class="btn ${ok?'green':'blue'}" id="nextQ">${last?'결과 보기 🏁':'다음 문제 ▶'}</button></div></div>`;
  document.querySelector('.progress').outerHTML=progressBar();
  $('nextQ').onclick=()=>{ sfx('click'); if(last) showResult(); else { QZ.qi++; renderQuestion(); } };
}
function showResult(){
  const i=QZ.si, st=STAGES[i], n=QZ.list.length, c=QZ.correct;
  const ratio=c/n, pass=ratio>=S.passRate-1e-9;
  const stars= ratio===1?3: ratio>=0.85?2: pass?1:0;
  const rec=S.stages[i]; let bonus=0, firstClear=false, perfectBonus=0;
  if(pass && !rec.cleared){ rec.cleared=true; bonus=50; firstClear=true; }
  if(stars===3 && !rec.perfectGiven){ rec.perfectGiven=true; perfectBonus=30; }
  rec.best=Math.max(rec.best,c); rec.stars=Math.max(rec.stars,stars);
  weekRecord(i,c,stars);   // 이번 주 랭킹 점수
  if(bonus+perfectBonus) addCoins(bonus+perfectBonus);
  save(); submitScore();
  const isFinal = firstClear && i===STAGES.length-1;
  let msg='';
  if(!pass) msg=`통과하려면 <b>${Math.ceil(n*S.passRate-1e-9)}문제</b> 이상 맞혀야 해요. 해설을 떠올리며 다시 도전해 볼까요? 💪`;
  else if(firstClear && i<STAGES.length-1) msg=`🔓 <b>「${STAGES[i+1].place}」</b>가 열렸어요!`;
  else if(isFinal) msg='🏆 마을의 모든 장소를 열었어요! 눈꽃마을 축제가 시작돼요!';
  else msg='다시 풀어서 별 3개에 도전해 봐요! ⭐';
  openModal(head(st,'결과')+`<div class="panel-body result">
    <div class="hostname" style="margin:0">${st.hostName}</div>
    <div class="score">${c} / ${n}</div>
    <div class="starsbig">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="feedback ${pass?'good':'bad'}" style="text-align:center">
      <div class="big">${pass?'통과! 정말 잘했어요 🎉':'조금만 더 힘내요!'}</div>
      얻은 도토리: <b>🌰 ${QZ.earned}</b>${bonus?` + 첫 통과 보너스 <b>🌰 ${bonus}</b>`:''}${perfectBonus?` + 만점 보너스 <b>🌰 ${perfectBonus}</b>`:''}<br>${msg}
    </div>
    <div class="rowbtns">
      <button class="btn cream" id="rAgain">🔁 다시 도전</button>
      ${isFinal?'<button class="btn gold" id="rEnd">🎆 마을 축제 보러 가기</button>':'<button class="btn green" id="rHome">🏡 마을로 돌아가기</button>'}
      ${pass?'<button class="btn blue" id="rShop">🛖 상점 가기</button>':''}
    </div></div>`);
  if(pass){ sfx('fanfare'); confetti(firstClear?120:60); } else sfx('wrong');
  $('rAgain').onclick=()=>{ const k=QZ.si; openStage(k); startQuestions(); };
  if($('rHome')) $('rHome').onclick=()=>{ QZ=null; closeModal(); renderBuildings(); renderHud(); if(firstClear) celebrateUnlock(i+1); };
  if($('rShop')) $('rShop').onclick=()=>{ QZ=null; renderBuildings(); renderHud(); openShop(); };
  if($('rEnd')) $('rEnd').onclick=()=>{ QZ=null; renderBuildings(); renderHud(); showEnding(); };
}
function celebrateUnlock(k){
  if(k>=STAGES.length) return;
  setTimeout(()=>{ const el=document.querySelectorAll('.bld.stage')[k]; if(!el) return; const [x,y]=elCenter(el,.4); burst(x,y,{n:40,speed:280,g:160,life:1.4,size:4}); burst(x,y,{n:10,chars:['🔓','⭐'],size:24,speed:200,g:160,life:1.3}); sfx('bell'); toast(`🔓 「${STAGES[k].place}」가 열렸어요! 가 볼까요?`); },400);
}

  if(it.kind!=='potion') equip(id);

  const cv=$('bcv'), g=cv.getContext('2d'), nx=$('bnext').getContext('2d');
  const board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  let piece=null, next=Math.floor(Math.random()*7), lines=0, over=false, timer=null, speed=650;
  const newPiece=()=>{ const id=next; next=Math.floor(Math.random()*7); const sh=BL_SHAPES[id].map(r=>r.slice()); return {id,sh,x:Math.floor((COLS-sh[0].length)/2),y:0}; };
  const fits=(sh,px,py)=>sh.every((row,j)=>row.every((v,i)=>!v||(px+i>=0&&px+i<COLS&&py+j<ROWS&&(py+j<0||!board[py+j][px+i]))));
  const rotate=sh=>sh[0].map((_,i)=>sh.map(r=>r[i]).reverse());
  function drawCell(ctx,x,y,c,s){ ctx.fillStyle=c; ctx.beginPath(); ctx.roundRect(x*s+1,y*s+1,s-2,s-2,5); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(x*s+4,y*s+4,s-8,3); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.roundRect(x*s+2,y*s+1,s-4,3,2); ctx.fill(); }
  function draw(){
    g.fillStyle='#1d2752'; g.fillRect(0,0,cv.width,cv.height);
    g.strokeStyle='rgba(255,255,255,.05)'; for(let i=1;i<COLS;i++){g.beginPath();g.moveTo(i*cell,0);g.lineTo(i*cell,cv.height);g.stroke();} for(let j=1;j<ROWS;j++){g.beginPath();g.moveTo(0,j*cell);g.lineTo(cv.width,j*cell);g.stroke();}
    board.forEach((row,j)=>row.forEach((v,i)=>{ if(v) drawCell(g,i,j,BL_COLORS[v-1],cell); }));
    if(piece){ // 떨어질 자리 그림자
      let gy=piece.y; while(fits(piece.sh,piece.x,gy+1)) gy++;
      g.globalAlpha=.22; piece.sh.forEach((row,j)=>row.forEach((v,i)=>{ if(v) drawCell(g,piece.x+i,gy+j,BL_COLORS[piece.id],cell); })); g.globalAlpha=1;
      piece.sh.forEach((row,j)=>row.forEach((v,i)=>{ if(v&&piece.y+j>=0) drawCell(g,piece.x+i,piece.y+j,BL_COLORS[piece.id],cell); }));
    }
    nx.clearRect(0,0,cell*4,cell*3); const ns=BL_SHAPES[next]; ns.forEach((row,j)=>row.forEach((v,i)=>{ if(v) drawCell(nx,i+(4-ns[0].length)/2,j+(ns.length<2?1:.5),BL_COLORS[next],cell); }));
  }
  function lock(){
    piece.sh.forEach((row,j)=>row.forEach((v,i)=>{ if(v&&piece.y+j>=0) board[piece.y+j][piece.x+i]=piece.id+1; }));
    let cleared=0;
    for(let j=ROWS-1;j>=0;j--){ if(board[j].every(v=>v)){ board.splice(j,1); board.unshift(Array(COLS).fill(0)); cleared++; j++; } }
    if(cleared){ lines+=cleared; $('bLines').textContent=lines; sfx(cleared>1?'fanfare':'correct'); const r=cv.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height*.7,{n:18*cleared,chars:['❄','✨'],size:16,speed:200,g:150,life:1}); speed=Math.max(220,650-lines*25); restart(); }
    else sfx('pop');
    piece=newPiece(); if(!fits(piece.sh,piece.x,piece.y)) gameOver();
  }
  function step(){ if(over) return; if(fits(piece.sh,piece.x,piece.y+1)) piece.y++; else lock(); draw(); }
  function restart(){ clearInterval(timer); timer=setInterval(step,speed); }
  function act(k){
    if(over||!piece) return;
    if(k==='L'&&fits(piece.sh,piece.x-1,piece.y)) piece.x--;
    else if(k==='R'&&fits(piece.sh,piece.x+1,piece.y)) piece.x++;
    else if(k==='D') step();
    else if(k==='rot'){ const r=rotate(piece.sh); for(const dx of [0,-1,1,-2,2]) if(fits(r,piece.x+dx,piece.y)){ piece.sh=r; piece.x+=dx; sfx('click'); break; } }
    else if(k==='drop'){ while(fits(piece.sh,piece.x,piece.y+1)) piece.y++; lock(); }
    draw();
  }
  function gameOver(){
    over=true; clearInterval(timer); const reward=Math.min(30,lines*3);
    $('bMsg').innerHTML=`<div class="feedback ${reward?'good':'bad'}" style="text-align:center"><div class="big">${reward?'🎉 블록 쌓기 끝!':'블록이 꼭대기까지 쌓였어요!'}</div>없앤 줄 <b>${lines}줄</b> → 도토리 <b>🌰 ${reward}</b> 받았어요!</div>
      <div class="rowbtns"><button class="btn green" id="bAgain">🔁 한 번 더</button><button class="btn cream" onclick="openPark()">🎡 다른 놀이기구</button></div>`;
    if(reward) parkCoins(reward,$('bMsg')); else sfx('wrong');
    $('bAgain').onclick=startBlocks; $('bMsg').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  const onKey=e=>{ const m={ArrowLeft:'L',ArrowRight:'R',ArrowDown:'D',ArrowUp:'rot',' ':'drop'}[e.key]; if(m){ e.preventDefault(); e.stopPropagation(); act(m); } };
  addEventListener('keydown',onKey,true);
  document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>act(b.dataset.k));
  parkCleanup=()=>{ over=true; clearInterval(timer); removeEventListener('keydown',onKey,true); };
  piece=newPiece(); draw(); restart();
}

/* ---------- 🎰 행운 룰렛 + 퀴즈 ---------- */
const WHEEL=[10,30,0,50,20,100,0,200];   // 룰렛 상품 (0은 꽝) · 최대 200
function startWheel(){
  // 룰렛(왼쪽) + 퀴즈(오른쪽)를 나란히 놓아 한 화면에
  openModal(parkHead('행운 룰렛',true)+`<div class="panel-body"><div class="wheelwrap">
    <div style="text-align:center"><div class="rpointer">▼</div><canvas id="rcv" width="280" height="280"></canvas>
    <div class="rowbtns" style="margin-top:6px"><button class="btn gold" id="spin">🎰 룰렛 돌리기!</button></div></div>
    <div id="wq"><div class="bubble" style="cursor:default;min-height:0">🐨 룰렛을 돌려서 나온 도토리를 걸고 퀴즈에 도전해요! 정답을 맞히면 그 도토리를 받아요. <b>최대 🌰200!</b></div></div></div></div>`,'wide');
  const cv=$('rcv'), g=cv.getContext('2d'); let ang=0, spinning=false, raf=0;
  const cols=['#ff8fa3','#7fd3ff','#c9d0dc','#ffd93d','#7CFFB2','#c77dff','#c9d0dc','#ffb347'];
  function draw(){
    const c=140, r=132, n=WHEEL.length; g.clearRect(0,0,280,280);
    for(let i=0;i<n;i++){ const a0=ang+i*2*Math.PI/n-Math.PI/2, a1=a0+2*Math.PI/n;
      g.beginPath(); g.moveTo(c,c); g.arc(c,c,r,a0,a1); g.closePath(); g.fillStyle=cols[i]; g.fill(); g.strokeStyle='#fff'; g.lineWidth=3; g.stroke();
      g.save(); g.translate(c,c); g.rotate(a0+Math.PI/n); g.fillStyle='#5a4632'; g.font=(WHEEL[i]>=100?'19px':'20px')+' Jua, sans-serif'; g.textAlign='right'; g.fillText(WHEEL[i]?'🌰'+WHEEL[i]:'꽝',r-12,7); g.restore(); }
    g.beginPath(); g.arc(c,c,24,0,7); g.fillStyle='#fff'; g.fill(); g.font='24px serif'; g.textAlign='center'; g.fillText('❄',c,c+8);
    g.beginPath(); g.arc(c,c,r,0,7); g.strokeStyle='#e8d6b5'; g.lineWidth=6; g.stroke();
  }
  draw();
  parkCleanup=()=>cancelAnimationFrame(raf);
  $('spin').onclick=()=>{
    if(spinning) return; spinning=true; $('spin').disabled=true; $('wq').innerHTML=''; sfx('click');
    const n=WHEEL.length, pick=Math.floor(Math.random()*n), seg=2*Math.PI/n;
    const target=ang - (ang%(2*Math.PI)) + 2*Math.PI*5 + (2*Math.PI - (pick*seg+seg/2)) ;
    const start=ang, t0=performance.now(), dur=3200; let lastTick=0;
    const tick=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3); ang=start+(target-start)*e; draw();
      const idx=Math.floor((ang)/seg); if(idx!==lastTick){ lastTick=idx; if(p<.95) sfx('blip'); }
      if(p<1) raf=requestAnimationFrame(tick); else { spinning=false; landed(pick); } };
    raf=requestAnimationFrame(tick);
  };
  function landed(i){
    const v=WHEEL[i];
    if(!v){ sfx('wrong'); $('wq').innerHTML=`<div class="feedback bad" style="text-align:center"><div class="big">꽝! 😝</div>괜찮아요, 다시 돌려 봐요!</div>`; $('spin').disabled=false; return; }
    sfx('bell');
    const pool=[]; STAGES.forEach(st=>st.questions.forEach(q=>{ if(q.t==='mc'||q.t==='ox') pool.push(q); }));
    const q=pool[Math.floor(Math.random()*pool.length)];
    const opts = q.t==='mc' ? shuffle(q.o.map((t,k)=>({t,ok:k===q.a}))) : [{t:'⭕ 맞아요',ok:q.a===true},{t:'❌ 틀려요',ok:q.a===false}];
    $('wq').innerHTML=`<div class="feedback good" style="margin-top:0"><div class="big">🌰 ${v}개에 도전!</div>퀴즈를 맞히면 도토리 ${v}개를 받아요.</div>
      <div class="qtext" style="margin-top:8px">${q.q}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="n">${k+1}</span>${o.t}</button>`).join('')}</div><div id="wfb"></div>`;
    document.querySelectorAll('#wq .opt').forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.k].ok;
      document.querySelectorAll('#wq .opt').forEach((bb,kk)=>{ bb.disabled=true; if(opts[kk].ok) bb.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      $('wfb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="big">${ok?`🎉 정답! 🌰 ${v} 획득!`:'😢 아쉬워요!'}</div>💡 ${q.e}</div>`;
      if(ok) parkCoins(v,b); else sfx('wrong');
      $('spin').disabled=false; $('spin').textContent='🎰 한 번 더 돌리기!';
    });
  }
}

const WINTER_PICS=['⛄','🎄','🎁','🧤','🧣','🦌','🔔','⛸️','🛷','☕','🍪','🌟','🐧','🎅','🎿','🕯️','❄️','🏂'];
function startCards(){
  const chosen=shuffle(WINTER_PICS).slice(0,8);

    <div class="rowbtns" style="margin:0 0 8px;justify-content:space-between"><span class="gstat">뒤집은 횟수 <span id="cMoves">0</span></span><span class="gstat">찾은 짝 <span id="cDone">0</span>/8</span></div>

    const [a,c]=open, ea=document.querySelector(`.fcard[data-i="${a}"]`), ec=document.querySelector(`.fcard[data-i="${c}"]`);
    if(cards[a].pid===cards[c].pid){
      setTimeout(()=>{ ea.classList.add('done'); ec.classList.add('done'); open=[]; lockB=false; done++; $('cDone').textContent=done; sfx('correct'); const [x,y]=elCenter(ec); burst(x,y,{n:14,chars:['✨','💚'],size:16,speed:150,g:120,life:.9});
        if(done===8){ const reward=moves<=12?20:moves<=16?15:10;
          // 완성 메시지는 카드판 위에 띄워서 화면 한 장에
          $('cMsg').innerHTML=`<div class="cdone"><div class="feedback good" style="text-align:center;margin:0"><div class="big">🎉 모든 짝을 찾았어요!</div>${moves}번 만에 성공 → 도토리 <b>🌰 ${reward}</b> 받았어요!
            <div class="rowbtns"><button class="btn green" id="cAgain">🔁 새 카드로 한 번 더</button><button class="btn cream" onclick="openPark()">🎡 다른 놀이기구</button></div></div></div>`;
          parkCoins(reward,$('cMsg')); confetti(60); $('cAgain').onclick=startCards; } },350);
    } else {
      setTimeout(()=>{ ea.classList.remove('open'); ec.classList.remove('open'); open=[]; lockB=false; },900);
    }
  });
}

  catch(e){ shell(notice+mine+'<div class="bubble" style="cursor:default;min-height:0;text-align:center">😢 랭킹을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div><div class="rowbtns"><button class="btn green" onclick="openRanking('+(manage?'true':'false')+')">🔄 다시 불러오기</button></div>'); return; }
  const items=data.items;
  let rank=0, prev=null; items.forEach((it,k)=>{ if(!prev||it.correct!==prev.correct||it.stars!==prev.stars) rank=k+1; it.rank=rank; prev=it; });
  const pages=Math.max(1,Math.ceil(items.length/RANK_PAGE)); page=Math.min(page,pages-1);
  const view=items.slice(page*RANK_PAGE,(page+1)*RANK_PAGE);
  const row=it=>{ const r=it.rank, medal=r===1?'🥇':r===2?'🥈':r===3?'🥉':r+'위', me=it.id===S.pid&&!S.isTeacher;
    return `<div class="rk ${r<=3?'top'+r:''} ${me?'me':''}"><span class="no">${medal}</span><span class="an">${it.animal}</span>
      <span class="nm">${escapeHtml(it.name)}${me?' <span style="color:var(--green)">(나)</span>':''}</span><span class="sc">${it.correct*10}점</span>
      ${manage?`<button class="btn red del" data-del="${it.id}" data-nm="${escapeHtml(it.name)}">삭제</button>`:''}</div>`; };
  const list = view.length ? `<div class="rkgrid"><div>${view.slice(0,5).map(row).join('')}</div><div>${view.slice(5).map(row).join('')}</div></div>`
    : '<div class="bubble" style="cursor:default;min-height:0;text-align:center">이번 주 랭킹에 아직 기록이 없어요. 첫 번째 주인공이 되어 볼까요? 🌟</div>';
  shell(notice+mine+list+
    `<div class="rowbtns" style="margin-top:8px">
      ${pages>1?`<button class="btn cream" ${page?'':'disabled'} onclick="openRanking(${!!manage},${page-1})">◀ 이전</button><span class="gstat" style="align-self:center">${page+1} / ${pages}쪽 · 참여 ${items.length}명</span><button class="btn cream" ${page<pages-1?'':'disabled'} onclick="openRanking(${!!manage},${page+1})">다음 ▶</button>`:`<span class="gstat" style="align-self:center">참여 ${items.length}명</span>`}
      <button class="btn cream" onclick="openRanking(${!!manage},${page})">🔄 새로고침</button>
      ${manage?'<button class="btn red" id="rkReset">🗑️ 전체 초기화</button><button class="btn green" onclick="openTeacher()">↩ 선생님 메뉴</button>':''}</div>`);
  const meIt=items.find(it=>it.id===S.pid); if(meIt&&$('myRank')) $('myRank').innerHTML=` · <b>${meIt.rank}위</b>`;
  if(manage){
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm(`「${b.dataset.nm}」 학생의 랭킹 기록을 지울까요?`)) return;
      await rankAdmin({action:'delete',id:b.dataset.del}); openRanking(true,page);
    });
    $('rkReset').onclick=async()=>{ if(!confirm('이번 주 랭킹 기록을 모두 지울까요? 되돌릴 수 없어요.')) return; await rankAdmin({action:'reset'}); openRanking(true); };
  }
}
async function rankAdmin(body){
  try{ const d=await rankPost(Object.assign({pw:teacherPw},body)); if(!d||!d.ok) throw 0; toast('✅ 처리했어요.'); }
  catch(e){ toast('😢 처리하지 못했어요. 비밀번호나 인터넷 연결을 확인해 주세요.'); }
}

/* =========================================================
   TEACHER MODE (비밀번호 보호)
   ========================================================= */
const T_KEY='1ey7we9-ze4dmr';
function pwHash(s){ let h=5381; for(const c of s) h=(((h<<5)+h)+c.charCodeAt(0))|0; let h2=7; for(const c of s.split('').reverse()) h2=(Math.imul(h2,31)+c.charCodeAt(0))|0; return (h>>>0).toString(36)+'-'+(h2>>>0).toString(36); }
let teacherInGame=false, teacherPw='';
function askTeacher(inGame){
  initAudio(); sfx('click'); teacherInGame=!!inGame;
  if(!inGame){ const sv=load(); S = sv || freshState(); }
  openModal(`<div class="panel-head"><div class="host">🧑‍🏫</div><h2>선생님 모드</h2><button class="closeX" onclick="closeModal()">✕</button></div>
   <div class="panel-body" style="text-align:center">
     <div class="label">비밀번호를 입력해 주세요</div>
     <input class="nameinput" id="tpw" type="password" inputmode="numeric" autocomplete="off" style="letter-spacing:4px">
     <div id="tErr" style="color:#d0533f;font-family:'Jua';min-height:1.4em;margin-top:6px"></div>
     <div class="rowbtns"><button class="btn green" id="tOk">확인</button></div>
   </div>`);
  const ok=()=>{ if(pwHash($('tpw').value.trim())===T_KEY){ teacherPw=$('tpw').value.trim(); sfx('correct'); openTeacher(); } else { sfx('wrong'); $('tErr').textContent='비밀번호가 맞지 않아요.'; $('tpw').value=''; $('tpw').focus(); } };
  $('tOk').onclick=ok; $('tpw').addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); }); setTimeout(()=>$('tpw').focus(),50);
}
function tAct(fn,msg){ fn(); save(); if(!$('start').classList.contains('hidden')){} else { renderHud(); renderBuildings(); applyEquips(); } sfx('pop'); openTeacher(msg); }
function openTeacher(msg){
  const rates=[0.5,0.6,0.7,0.8,0.9,1];
  openModal(`<div class="panel-head"><div class="host">🧑‍🏫</div><h2>선생님 모드<div style="font-size:.6em;color:#6c8f78">${S.name?`현재 학생: ${S.animal} ${escapeHtml(S.name)} · 🌰 ${S.coins} · 통과 ${clearedCount()}/5`:'저장된 학생 기록이 없어요'}</div></h2><button class="closeX" onclick="closeModal()">✕</button></div>
   <div class="panel-body help">
    ${msg?`<div class="feedback good" style="margin:0 0 6px;padding:6px 14px">✅ ${msg}</div>`:''}
    <div class="cols2"><div>
    <h3>🔑 단계 잠금</h3>
    <div class="rowbtns" style="justify-content:flex-start;margin-top:4px">
      <button class="btn ${S.allOpen?'cream':'green'}" id="tOpen">${S.allOpen?'🔒 순서대로 열기로 되돌리기':'🔓 모든 단계 바로 열기'}</button>
    </div>
    <h3>🎯 통과 기준 (현재 ${Math.round(S.passRate*100)}%)</h3>
    <div class="tabs">${rates.map(r=>`<button class="${Math.abs(S.passRate-r)<1e-6?'on':''}" data-r="${r}">${Math.round(r*100)}%</button>`).join('')}</div>
    <h3>🌰 도토리 · 아이템</h3>
    <div class="rowbtns" style="justify-content:flex-start;margin-top:4px">
      <button class="btn gold" data-c="100">+100 🌰</button><button class="btn gold" data-c="500">+500 🌰</button>
      <button class="btn blue" id="tItems">🎁 모든 아이템 받기</button>
    </div>
    </div><div>
    <h3>🏆 반 랭킹</h3>
    <div class="rowbtns" style="justify-content:flex-start;margin-top:4px">
      <button class="btn gold" id="tRank">🏆 랭킹 관리 (기록 삭제·초기화)</button>
    </div>
    <h3>📋 수업 자료</h3>
    <div class="rowbtns" style="justify-content:flex-start;margin-top:4px">
      <button class="btn cream" id="tAns">📋 문제와 정답 모두 보기</button>
    </div>
    <h3>🔄 기록 관리</h3>
    <div class="rowbtns" style="justify-content:flex-start;margin-top:4px">
      <button class="btn red" id="tReset">🔄 학생 기록 모두 지우기</button>
    </div>
    </div></div>
    <div class="rowbtns" style="margin-top:12px">
      <button class="btn green" id="tGo">${$('start').classList.contains('hidden')?'🏡 마을로 돌아가기':'▶ 선생님으로 마을 둘러보기'}</button>
    </div>
   </div>`,'wide');
  $('tOpen').onclick=()=>tAct(()=>{ S.allOpen=!S.allOpen; }, S.allOpen?'단계를 다시 순서대로 열리게 했어요.':'모든 단계를 열었어요.');
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>tAct(()=>{ S.passRate=+b.dataset.r; }, `통과 기준을 ${Math.round(+b.dataset.r*100)}%로 바꿨어요.`));
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>tAct(()=>{ S.coins+=+b.dataset.c; }, `도토리 ${b.dataset.c}개를 줬어요.`));
  $('tItems').onclick=()=>tAct(()=>{ ITEMS.forEach(it=>{ if(!S.owned.includes(it.id)) S.owned.push(it.id); S.qty[it.id]=maxOf(it); }); }, '모든 아이템을 최대 개수로 넣었어요. (상점의 내 아이템 탭에서 착용)');
  $('tAns').onclick=showAnswers;
  $('tRank').onclick=()=>openRanking(true);
  $('tReset').onclick=()=>{ if(confirm('학생의 진행 상황, 도토리, 아이템이 모두 지워져요. 정말 지울까요?')){ try{localStorage.removeItem(SAVE_KEY)}catch(e){} location.reload(); } };
  $('tGo').onclick=()=>{
    if($('start').classList.contains('hidden')){ closeModal(); return; }
    if(!S.name){ S.name='선생님'; S.animal='🐻'; S.isTeacher=true; }
    save(); closeModal(); enterGame();
  };
}
function showAnswers(si){
  si=si||0;
  const ans=q=>{
    if(q.t==='mc') return q.o[q.a];
    if(q.t==='ox') return q.a?'⭕ (맞다)':'❌ (틀리다)';
    if(q.t==='order') return q.items.join(' → ');
    if(q.t==='sort') return q.bins.map((b,bi)=>`[${b}] `+q.items.filter(x=>x[1]===bi).map(x=>x[0]).join(', ')).join(' / ');
  };
  const st=STAGES[si];
  // 장소별 탭으로 나눠서 한 화면에 (스크롤 없이)
  openModal(`<div class="panel-head"><div class="host">📋</div><h2>문제와 정답<div style="font-size:.6em;color:#6c8f78">${st.icon} ${si+1}단계 ${st.place} — ${st.topic}</div></h2><button class="closeX" onclick="openTeacher()">↩</button></div>
   <div class="panel-body help">
     <div class="tabs">${STAGES.map((s,i)=>`<button class="${i===si?'on':''}" onclick="showAnswers(${i})">${s.icon} ${i+1}단계</button>`).join('')}</div>
     <div class="anslist">${st.questions.map((q,k)=>`<div><b>${k+1}. [${TAGS[q.t]}]</b> ${q.q}<br><span style="color:#3f8f55">정답: <b>${ans(q)}</b></span></div>`).join('')}</div>
   </div>`,'wide');
}
function showEnding(){
  S.ended=true; save();
  const total=S.stages.reduce((a,s)=>a+s.stars,0);
  const d=new Date();
  openModal(`<div class="panel-head"><div class="host">🦌</div><h2>🎆 눈꽃마을 축제!</h2><button class="closeX" onclick="closeModal()">✕</button></div>
   <div class="panel-body">
    <div class="bubble" style="cursor:default;min-height:0">🦌 <b>루루 촌장</b> : 축하한다, <b>${escapeHtml(S.name)}</b>! 너는 민주주의가 자라 온 길과 ‘한강의 기적’, 시장경제와 착한 기업, 그리고 함께 만들어 갈 미래까지 모두 탐험했구나. 민주주의와 경제는 함께 자란다는 것, 꼭 기억하렴! 🎄<br>이제 <b>🎡 눈꽃 놀이동산</b>에서 마음껏 놀며 도토리를 더 모아 보렴!</div>
    <div id="cert">
      <h1>수 료 증</h1>
      <div class="who">${S.animal} ${escapeHtml(S.name)}</div>
      <p>위 어린이는 <b>눈꽃마을 시간여행</b>에서<br>우리나라 민주주의의 발전과 산업의 발달,<br>시장경제와 기업의 사회적 책임, 경제성장과 우리 생활을<br>모두 탐험하였기에 이 증서를 드립니다.</p>
      <p style="margin-top:10px">획득한 별 ⭐ ${total} / 15</p>
      <p>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</p>
      <div class="seal">🦌🎄🐿️</div>
      <p class="jua">눈꽃마을 촌장 루루</p>
    </div>
    <div class="rowbtns"><button class="btn blue" onclick="window.print()">🖨️ 수료증 인쇄</button><button class="btn gold" onclick="openPark()">🎡 놀이동산 가기</button><button class="btn green" onclick="closeModal()">🏡 마을 구경하기</button></div>
   </div>`);
  sfx('fanfare'); confetti(160);
  let k=0; const iv=setInterval(()=>{ firework(); if(++k>8) clearInterval(iv); },420);
}

// 이름 규칙: 완성된 한글 1~5글자 + 바르지 않은 말 금지
const BAD_WORDS=['씨발','시발','씨바','시바','씨빨','씨팔','시팔','씹','좆','좇','좃','존나','졸라','병신','븅신','빙신','등신','개새','새끼','쌔끼','섹스','섹시','야동','지랄','염병','썅','쌍놈','쌍년','개년','개놈','니미','느금','애미','애비','엄창','미친','미쳤','꺼져','닥쳐','엿먹','찐따','장애','호구','꼴통','변태','바보','멍청','멍텅','똥개','일베','한남','한녀','틀딱','급식충','보지','자지','죽어','죽을','뒤져','뒈져','살인','패드립','엠창','개같','개소리','또라이','돌아이','싸가지','븅'];
function checkName(nm){
  if(!nm) return '마을 이름을 적어 주세요! 예) 그린이네, 햇살마을 ✏️';
  if(!/^[가-힣]+$/.test(nm)) return '마을 이름은 한글(완성된 글자)로만 적어 주세요! 🙂';
  if(nm.length>5) return '마을 이름은 5글자까지만 쓸 수 있어요!';
  if(BAD_WORDS.some(w=>nm.includes(w))) return '바르고 고운 말로 마을 이름을 지어 주세요! 💚';
  return '';
}
let pickAnimal=ANIMALS[0];
(function setupStart(){
  const box=$('animalPick');
  box.innerHTML=ANIMALS.map(a=>`<button data-a="${a}" class="${a===pickAnimal?'sel':''}">${a}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ initAudio(); sfx('pop'); pickAnimal=b.dataset.a; box.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b)); });
  const saved=load();
  if(saved && saved.name){ $('continueBox').classList.remove('hidden'); $('btnContinue').textContent=`▶ 이어하기 (${saved.animal} ${saved.name})`; $('btnContinue').onclick=()=>{ S=saved; enterGame(); }; }
  $('btnStart').onclick=()=>{
    const nm=$('nameInput').value.replace(/\s/g,'');
    const err=checkName(nm);
    $('nameErr').textContent=err||'';
    if(err){ initAudio(); sfx('locked'); $('nameInput').focus(); $('nameInput').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250}); return; }
    if(saved && saved.name && !confirm('새로 시작하면 저장된 진행 상황이 지워져요. 괜찮을까요?')) return;
    S=freshState(); S.name=nm; S.animal=pickAnimal; save(); enterGame();
  };
  $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnStart').click(); });
})();
function enterGame(){
  initAudio(); if(S.music) startMusic();
  $('start').classList.add('hidden'); $('hud').classList.remove('hidden');
  renderHud(); renderBuildings(); applyEquips();
  save(); submitScore();
  sfx('fanfare');
  setTimeout(()=>toast(clearedCount()===0?`🐿️ ${escapeHtml(S.name)}, 반가워! <b>방향키</b>로 걸어서 「여기!」 표시된 곳에 가 보자!`:`🐿️ 다시 왔구나, ${escapeHtml(S.name)}! 계속 탐험해 보자~`),500);
}
$('btnTeacher').onclick=()=>askTeacher(false);
$('btnRankStart').onclick=()=>{ initAudio(); const sv=load(); if(sv) S=sv; openRanking(false); };
$('btnRank').onclick=()=>openRanking(false);
$('btnShop').onclick=openShop;
$('btnHelp').onclick=openHelp;
$('btnMusic').onclick=()=>{ initAudio(); S.music=!S.music; save(); renderHud(); if(S.music) startMusic(); else stopMusic(); };
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });
